# Ground truth for NRA B-2 sheets photographed with the Pi HQ camera (test-cards/nra/).
# Hand scores per hole, clockwise from 12 o'clock. 0 = flier/miss outside the rings.
# Sheet numbers are the handwritten "#n" on the paper.

target:
  name: nra_b2
  pellet_mm: 5.6        # .22 LR

capture:
  camera: rpi_hq_imx477
  lens: canon_efs_55_250_is
  distance_m: 9         # "less than 10 m"

cards:
  - file: 20261022_114115.jpg
    sheet: 1
    notes: "first test capture, lens at wide end: sheet only ~1300 px wide (0.22 mm/px)"
    holes:
      - {score: 8}
      - {score: 10}
      - {score: 9}
      - {score: 9}
      - {score: 8}
      - {score: 7, seen: "edge of black"}
      - {score: 9, seen: "on the 9 numeral"}
      - {score: 8}

  - {file: 20261022_122753.jpg, sheet: 1, notes: "second capture of sheet 1, 0.17 mm/px", holes: []}
  - {file: 20261022_122907.jpg, sheet: 2, notes: "lens at wide end, 0.17 mm/px", holes: []}
