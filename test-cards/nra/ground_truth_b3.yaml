# Ground truth for NRA B-3 sheets photographed with the Pi HQ camera (test-cards/nra/).
# Hand scores per hole, clockwise from 12 o'clock; X = inner ten. 0 = outside the rings.
# Sheet numbers are the handwritten "#n" on the paper. Scores to be filled in from the shooter.

target:
  name: nra_b3
  pellet_mm: 5.6        # .22 LR

capture:
  camera: rpi_hq_imx477
  lens: canon_efs_55_250_is
  distance_m: 9

