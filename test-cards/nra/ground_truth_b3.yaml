# Ground truth for NRA B-3 sheets photographed with the Pi HQ camera (test-cards/nra/).
# Hand scores per hole as given by the shooter (not in clock order); X = inner ten. 0 = outside the rings.
# Sheet numbers are the handwritten "#n" on the paper. Edge hits are scored with the higher value (rule 14.3).

