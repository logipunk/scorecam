<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Match setup – phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0F1215}
a{color:#F5A524}a:hover{color:#FFC35C}
button,input{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px; background: #0F1215; color: #E9EDF1; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px">

  <div style="display: flex; flex-direction: column; gap: 2px">
    <div style="font-size: 20px; font-weight: 600">Match setup</div>
    <div style="font-size: 13px; color: #9AA4AE">10m Air Pistol · 4.5 mm</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <div style="font-size: 11px; color: #9AA4AE; text-transform: uppercase; letter-spacing: 0.06em">Course of fire</div>
    <sc-for list="{{presets}}" as="p" hint-placeholder-count="3">
      <button aria-pressed="{{p.pressed}}" onClick="{{p.pick}}" style="min-height: 52px; padding: 8px 12px; border-radius: 10px; border: 1px solid {{p.border}}; background: {{p.bg}}; color: #E9EDF1; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left">
        <span style="font-size: 15px; font-weight: 600">{{p.name}}</span>
        <span style="font-size: 12px; color: #9AA4AE">{{p.desc}}</span>
      </button>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <div style="font-size: 11px; color: #9AA4AE; text-transform: uppercase; letter-spacing: 0.06em">Shots per card</div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #171B20; border: 1px solid #2A3038; border-radius: 12px">
      <sc-for list="{{perCardOpts}}" as="o" hint-placeholder-count="4">
        <button aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="height: 40px; border: 0; border-radius: 9px; font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; background: {{o.bg}}; color: {{o.fg}}">{{o.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="tot" style="font-size: 11px; color: #9AA4AE; text-transform: uppercase; letter-spacing: 0.06em">Match shots</label>
      <input id="tot" value="{{total}}" style="height: 44px; box-sizing: border-box; padding: 0 10px; border-radius: 9px; border: 1px solid #3A424C; background: #1E2329; color: #E9EDF1; font-family: 'IBM Plex Mono', monospace; font-size: 15px; width: 100%">
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="ser" style="font-size: 11px; color: #9AA4AE; text-transform: uppercase; letter-spacing: 0.06em">Series of</label>
      <input id="ser" value="10" style="height: 44px; box-sizing: border-box; padding: 0 10px; border-radius: 9px; border: 1px solid #3A424C; background: #1E2329; color: #E9EDF1; font-family: 'IBM Plex Mono', monospace; font-size: 15px; width: 100%">
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="tim" style="font-size: 11px; color: #9AA4AE; text-transform: uppercase; letter-spacing: 0.06em">Time (min)</label>
      <input id="tim" value="{{time}}" style="height: 44px; box-sizing: border-box; padding: 0 10px; border-radius: 9px; border: 1px solid #3A424C; background: #1E2329; color: #E9EDF1; font-family: 'IBM Plex Mono', monospace; font-size: 15px; width: 100%">
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <div style="font-size: 11px; color: #9AA4AE; text-transform: uppercase; letter-spacing: 0.06em">When a card is full</div>
    <sc-for list="{{cardModes}}" as="m" hint-placeholder-count="2">
      <button aria-pressed="{{m.pressed}}" onClick="{{m.pick}}" style="min-height: 48px; padding: 8px 12px; border-radius: 10px; border: 1px solid {{m.border}}; background: {{m.bg}}; color: #E9EDF1; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left">
        <span style="font-size: 14px; font-weight: 600">{{m.name}}</span>
        <span style="font-size: 12px; color: #9AA4AE">{{m.desc}}</span>
      </button>
    </sc-for>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 12px; background: #171B20; border: 1px solid #2A3038; border-radius: 12px">
    <div style="font-size: 14px; color: #9AA4AE">Cards needed</div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600">{{cards}} <span style="font-size: 13px; color: #9AA4AE">+ sighters</span></div>
  </div>

  <div style="flex-grow: 1"></div>
  <button style="height: 52px; border: 0; border-radius: 12px; background: #F5A524; color: #1A1206; font-size: 16px; font-weight: 600">Start sighters</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { preset: 'club', perCard: 5, cardMode: 'prompt' };
  }
  renderVals() {
    const presetDefs = [
      { id: 'issf', name: 'ISSF qualification', desc: '60 shots · 1 per card · 75 min · integer scoring', perCard: 1, total: 60, time: 75 },
      { id: 'club', name: 'Club match', desc: '60 shots · cards of 2, 5 or 10 · 75 min', perCard: 5, total: 60, time: 75 },
      { id: 'train', name: 'Training', desc: 'Open shot count · no clock · decimal scoring', perCard: 10, total: 0, time: 0 }
    ];
    const cur = presetDefs.find((p) => p.id === this.state.preset) || presetDefs[1];
    const presets = presetDefs.map((p) => ({
      name: p.name, desc: p.desc,
      pressed: p.id === cur.id ? 'true' : 'false',
      bg: p.id === cur.id ? '#2A2113' : '#171B20',
      border: p.id === cur.id ? '#F5A524' : '#2A3038',
      pick: () => this.setState({ preset: p.id, perCard: p.perCard })
    }));
    const perCardOpts = [1, 2, 5, 10].map((n) => ({
      label: String(n),
      pressed: n === this.state.perCard ? 'true' : 'false',
      bg: n === this.state.perCard ? '#2E353D' : 'transparent',
      fg: n === this.state.perCard ? '#E9EDF1' : '#9AA4AE',
      pick: () => this.setState({ perCard: n })
    }));
    const modeDefs = [
      { id: 'prompt', name: 'Pause and prompt', desc: 'Scoring pauses until you tap Next card' },
      { id: 'auto', name: 'Auto-detect new card', desc: 'Camera sees the fresh card and recalibrates' }
    ];
    const cardModes = modeDefs.map((m) => ({
      name: m.name, desc: m.desc,
      pressed: m.id === this.state.cardMode ? 'true' : 'false',
      bg: m.id === this.state.cardMode ? '#2A2113' : '#171B20',
      border: m.id === this.state.cardMode ? '#F5A524' : '#2A3038',
      pick: () => this.setState({ cardMode: m.id })
    }));
    const total = cur.total;
    return {
      presets: presets, perCardOpts: perCardOpts, cardModes: cardModes,
      total: total ? String(total) : 'Open',
      time: cur.time ? String(cur.time) : 'None',
      cards: total ? String(Math.ceil(total / this.state.perCard)) : '–'
    };
  }
}
</script>
</body>
</html>
