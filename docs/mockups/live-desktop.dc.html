<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live series – desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0F1215}
a{color:#F5A524}a:hover{color:#FFC35C}
button,select{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="min-height: 900px; box-sizing: border-box; background: #0F1215; color: #E9EDF1; font-family: 'IBM Plex Sans', system-ui, sans-serif; padding: 20px">
<div style="max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px">

  <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; background: #171B20; border: 1px solid #2A3038; border-radius: 14px">
    <div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap">
      <div style="font-size: 18px; font-weight: 600">Live session</div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 999px; background: #17201E; border: 1px solid #23413A; font-size: 13px; font-weight: 500; color: #7FE3CF">
        <span style="width: 8px; height: 8px; border-radius: 999px; background: #34D3B6; display: block"></span>
        Camera connected · Lane 1
      </div>
    </div>
    <div style="display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="tgt" style="font-size: 11px; color: #9AA4AE; text-transform: uppercase; letter-spacing: 0.06em">Target</label>
        <select id="tgt" style="height: 40px; padding: 0 10px; border-radius: 9px; border: 1px solid #3A424C; background: #1E2329; color: #E9EDF1; font-size: 14px">
          <option>ISSF 10m Air Pistol</option>
          <option>NRA B-2 · 50 ft</option>
          <option>NRA B-3 · 50 ft</option>
        </select>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="cal" style="font-size: 11px; color: #9AA4AE; text-transform: uppercase; letter-spacing: 0.06em">Caliber</label>
        <select id="cal" style="height: 40px; padding: 0 10px; border-radius: 9px; border: 1px solid #3A424C; background: #1E2329; color: #E9EDF1; font-size: 14px">
          <option>4.5 mm</option>
          <option>.22</option>
          <option>.45</option>
        </select>
      </div>
      <button style="height: 40px; padding: 0 16px; border-radius: 9px; border: 0; background: #F5A524; color: #1A1206; font-size: 14px; font-weight: 600">Next card</button>
      <button style="height: 40px; padding: 0 16px; border-radius: 9px; border: 1px solid #3A424C; background: #1E2329; color: #E9EDF1; font-size: 14px; font-weight: 500">Recalibrate</button>
      <button style="height: 40px; padding: 0 16px; border-radius: 9px; border: 1px solid #3A424C; background: #1E2329; color: #E9EDF1; font-size: 14px; font-weight: 500">End session</button>
    </div>
  </div>

  <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">

    <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 12px; padding: 16px; background: #171B20; border: 1px solid #2A3038; border-radius: 14px">
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #0F1215; border: 1px solid #2A3038; border-radius: 12px; width: 240px">
          <button aria-pressed="{{plotPressed}}" onClick="{{showPlot}}" style="height: 40px; border: 0; border-radius: 9px; font-size: 14px; font-weight: 600; background: {{plotBg}}; color: {{plotFg}}">Plot</button>
          <button aria-pressed="{{camPressed}}" onClick="{{showCam}}" style="height: 40px; border: 0; border-radius: 9px; font-size: 14px; font-weight: 600; background: {{camBg}}; color: {{camFg}}">Camera</button>
        </div>
        <div style="font-size: 13px; color: #9AA4AE">Series 1 of 6 · card 2 of 12 (5 per card) · last shot 0:42 ago · 1:12:30 left</div>
      </div>
      <div style="border-radius: 12px; overflow: hidden; background: {{frameBg}}; position: relative; padding: 12px">
        <svg viewBox="-82 -82 164 164" style="display: block; width: 100%; height: auto; max-width: 640px; margin: 0 auto" aria-label="Target with shot positions">
          <circle cx="0" cy="0" r="77.75" fill="{{paper}}"></circle>
          <circle cx="0" cy="0" r="29.75" fill="{{black}}"></circle>
          <sc-for list="{{rings}}" as="ring" hint-placeholder-count="10">
            <circle cx="0" cy="0" r="{{ring.r}}" fill="none" stroke="{{ring.stroke}}" stroke-width="0.35"></circle>
          </sc-for>
          <circle cx="0" cy="0" r="2.5" fill="none" stroke="#E6E6E6" stroke-width="0.3"></circle>
          <sc-for list="{{labels}}" as="lab" hint-placeholder-count="32">
            <text x="{{lab.x}}" y="{{lab.y}}" fill="{{lab.fill}}" font-size="3.6" font-family="IBM Plex Mono, monospace" text-anchor="middle" dominant-baseline="central">{{lab.t}}</text>
          </sc-for>
          <sc-if value="{{isCam}}" hint-placeholder-val="{{ false }}">
            <sc-for list="{{shots}}" as="s" hint-placeholder-count="10">
              <circle cx="{{s.x}}" cy="{{s.y}}" r="2.25" fill="#0A0A0A"></circle>
            </sc-for>
            <sc-for list="{{shots}}" as="s" hint-placeholder-count="10">
              <circle cx="{{s.x}}" cy="{{s.y}}" r="3.4" fill="none" stroke="{{s.color}}" stroke-width="0.8"></circle>
            </sc-for>
          </sc-if>
          <sc-if value="{{isPlot}}" hint-placeholder-val="{{ true }}">
            <sc-for list="{{shots}}" as="s" hint-placeholder-count="10">
              <circle cx="{{s.x}}" cy="{{s.y}}" r="2.25" fill="{{s.color}}" stroke="#0B0D0F" stroke-width="0.35"></circle>
            </sc-for>
          </sc-if>
          <sc-for list="{{selectedRing}}" as="sel" hint-placeholder-count="1">
            <circle cx="{{sel.x}}" cy="{{sel.y}}" r="4.7" fill="none" stroke="#0B0D0F" stroke-width="1.1"></circle>
            <circle cx="{{sel.x}}" cy="{{sel.y}}" r="4.1" fill="none" stroke="#FFFFFF" stroke-width="0.7"></circle>
          </sc-for>
        </svg>
        <sc-if value="{{isCam}}" hint-placeholder-val="{{ false }}">
          <div style="position: absolute; left: 20px; bottom: 20px; padding: 4px 8px; border-radius: 6px; background: rgba(15,18,21,0.82); font-size: 12px; color: #E9EDF1">Camera feed · markers overlaid</div>
        </sc-if>
      </div>
    </div>

    <div style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 12px">

      <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px; background: #171B20; border: 1px solid #2A3038; border-radius: 14px">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
          <div style="font-size: 12px; color: #9AA4AE; text-transform: uppercase; letter-spacing: 0.06em">Series total</div>
          <div style="font-size: 13px; color: #9AA4AE">2 inner tens</div>
        </div>
        <div style="display: flex; align-items: baseline; gap: 14px">
          <div style="font-family: 'IBM Plex Mono', monospace; font-size: 48px; font-weight: 600; line-height: 1">93</div>
          <div style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 500; color: #9AA4AE">98.3</div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px">
          <sc-for list="{{series}}" as="sr" hint-placeholder-count="6">
            <button aria-pressed="{{sr.pressed}}" style="height: 48px; border-radius: 9px; border: 1px solid {{sr.border}}; background: {{sr.bg}}; color: #E9EDF1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px">
              <span style="font-size: 11px; color: #9AA4AE">{{sr.label}}</span>
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600">{{sr.total}}</span>
            </button>
          </sc-for>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; padding: 8px; background: #171B20; border: 1px solid #2A3038; border-radius: 14px">
        <div style="display: grid; grid-template-columns: 40px 32px minmax(0, 1fr) 64px; gap: 8px; padding: 6px 10px; font-size: 11px; color: #9AA4AE; text-transform: uppercase; letter-spacing: 0.06em">
          <span>#</span><span>Dir</span><span>Score</span><span style="text-align: right">Split</span>
        </div>
        <sc-for list="{{shots}}" as="s" hint-placeholder-count="10">
          <button onClick="{{s.select}}" aria-label="Shot {{s.n}}, {{s.score}}" style="display: grid; grid-template-columns: 40px 32px minmax(0, 1fr) 64px; gap: 8px; align-items: center; height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid {{s.rowBorder}}; background: {{s.rowBg}}; color: #E9EDF1; text-align: left">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #9AA4AE">{{s.n}}</span>
            <svg viewBox="-8 -8 16 16" width="14" height="14" aria-hidden="true"><g transform="rotate({{s.angle}})"><path d="M-5 0 H5 M2 -3 L5 0 L2 3" fill="none" stroke="{{s.color}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></g></svg>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600">{{s.score}}</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #9AA4AE; text-align: right">{{s.time}}</span>
          </button>
        </sc-for>
      </div>

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <div style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; background: #171B20; border: 1px solid #2A3038; border-radius: 12px">
          <div style="font-size: 11px; color: #9AA4AE; text-transform: uppercase; letter-spacing: 0.06em">Group center</div>
          <div style="font-size: 14px; font-weight: 500">0.3 mm right · 0.7 mm low</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; background: #171B20; border: 1px solid #2A3038; border-radius: 12px">
          <div style="font-size: 11px; color: #9AA4AE; text-transform: uppercase; letter-spacing: 0.06em">Group size</div>
          <div style="font-size: 14px; font-weight: 500">31.4 mm c-c</div>
        </div>
      </div>

      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 6px 6px 14px; background: #171B20; border: 1px solid #2A3038; border-radius: 12px">
        <div style="flex-grow: 1; font-size: 14px; font-weight: 500">Shot {{selN}} · <span style="font-family: 'IBM Plex Mono', monospace">{{selScore}}</span></div>
        <button style="height: 44px; padding: 0 14px; border-radius: 9px; border: 1px solid #3A424C; background: #1E2329; color: #E9EDF1; font-size: 14px; font-weight: 500">Move</button>
        <button style="height: 44px; padding: 0 14px; border-radius: 9px; border: 1px solid #3A424C; background: #1E2329; color: #E9EDF1; font-size: 14px; font-weight: 500">Delete</button>
        <button style="height: 44px; padding: 0 14px; border-radius: 9px; border: 0; background: #F5A524; color: #1A1206; font-size: 14px; font-weight: 600">Add / Miss</button>
      </div>
    </div>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { view: 'plot', selected: 10 };
  }
  renderVals() {
    const R = [77.75, 69.75, 61.75, 53.75, 45.75, 37.75, 29.75, 21.75, 13.75, 5.75];
    const cam = this.state.view === 'camera';
    const rings = R.map((r, i) => ({ r: r, stroke: i >= 6 ? '#E6E6E6' : (cam ? '#3A3833' : '#2B2B2B') }));
    const labels = [];
    for (let n = 1; n <= 8; n++) {
      const mid = (R[n - 1] + R[n]) / 2;
      const fill = n >= 7 ? '#E6E6E6' : (cam ? '#3A3833' : '#2B2B2B');
      labels.push({ x: mid, y: 0, t: String(n), fill: fill });
      labels.push({ x: -mid, y: 0, t: String(n), fill: fill });
      labels.push({ x: 0, y: -mid, t: String(n), fill: fill });
      labels.push({ x: 0, y: mid, t: String(n), fill: fill });
    }
    const pts = [[3,-4],[-9,6],[2,11],[-4,-2],[14,3],[-2,8],[7,-10],[-15,-9],[1,-1],[6,5]];
    const scores = ['10.4','9.6','9.6','10.5','9.2','9.9','9.4','8.8','10.9','10.0'];
    const times = ['—','0:44','0:39','0:51','0:47','0:42','0:55','0:40','0:46','0:42'];
    const sel = this.state.selected;
    const shots = pts.map((p, i) => {
      const n = i + 1;
      const isLast = n === pts.length;
      const isSel = n === sel;
      return {
        n: n, x: p[0], y: p[1], score: scores[i], time: times[i],
        angle: Math.round(Math.atan2(p[1], p[0]) * 180 / Math.PI),
        color: isLast ? '#F5A524' : '#5AA9FF',
        rowBg: isSel ? '#2A2113' : 'transparent',
        rowBorder: isSel ? '#F5A524' : 'transparent',
        select: () => this.setState({ selected: n })
      };
    });
    const series = ['S1','S2','S3','S4','S5','S6'].map((l, i) => ({
      label: l, total: i === 0 ? '93' : '–', pressed: i === 0 ? 'true' : 'false',
      bg: i === 0 ? '#2E353D' : '#1E2329', border: i === 0 ? '#5A6370' : '#2A3038'
    }));
    const s = shots[sel - 1];
    return {
      rings: rings, labels: labels, shots: shots, series: series,
      selectedRing: s ? [{ x: s.x, y: s.y }] : [],
      selN: s ? s.n : '–', selScore: s ? s.score : '–',
      isCam: cam, isPlot: !cam,
      paper: cam ? '#C9C4B8' : '#F3EFE6', black: cam ? '#262626' : '#16191C',
      frameBg: cam ? '#5B5850' : '#0F1215',
      plotPressed: cam ? 'false' : 'true', camPressed: cam ? 'true' : 'false',
      plotBg: cam ? 'transparent' : '#2E353D', plotFg: cam ? '#9AA4AE' : '#E9EDF1',
      camBg: cam ? '#2E353D' : 'transparent', camFg: cam ? '#E9EDF1' : '#9AA4AE',
      showPlot: () => this.setState({ view: 'plot' }),
      showCam: () => this.setState({ view: 'camera' })
    };
  }
}
</script>
</body>
</html>
